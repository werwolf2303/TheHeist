<body>
  <div id="screen">

    <div class="lockup">
      <img class="vault-icon" src="icon.png" alt="The Heist" width="114" height="114" />
      <h1><strong>The</strong> <strong>Heist</strong></h1>
    </div>

    <!-- play button -->
    <div id="play-step">
      <button class="btn-play" id="play-button">Play</button>
    </div>

    <!-- upload panel -->
    <div id="upload-step" class="panel">
      <div class="upload-body">
        <p>This site doesn't include the game — upload your own decrypted copy of <strong>The Heist</strong> (.ipa) to play.</p>
      </div>
      <div class="row-sep"></div>
      <div class="upload-row">
        <label for="file-input-trigger">.ipa file</label>
        <label class="btn-choose" id="file-input-trigger" tabindex="0">Choose file</label>
        <input id="file-input" type="file" accept=".ipa" />
      </div>
      <div class="chosen-name" id="chosen-name"></div>
      <div class="row-sep"></div>
      <div class="hint-row">
        The .ipa must be decrypted.
      </div>
    </div>

    <!-- progress -->
    <div id="progress-bar">
      <div class="progress-track"><div id="progress-fill"></div></div>
      <div id="progress-text"></div>
    </div>

    <!-- error -->
    <div id="error-text"></div>

  </div>

  <div id="game-canvas-holder"></div>
